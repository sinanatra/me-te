-type=\"widget\" data-widget_type=\"spacer.default\">\n\t\t\t\t\u003Cdiv class=\"elementor-widget-container\">\n\t\t\t\t\t\t\t\u003Cdiv class=\"elementor-spacer\">\n\t\t\t\u003Cdiv class=\"elementor-spacer-inner\">\u003C/div>\n\t\t\u003C/div>\n\t\t\t\t\t\t\u003C/div>\n\t\t\t\t\u003C/div>\n\t\t\t\t\u003Cdiv class=\"elementor-element elementor-element-1088da3 elementor-widget-tablet__width-initial elementor-widget-mobile__width-inherit elementor-widget elementor-widget-text-editor\" data-id=\"1088da3\" data-element_type=\"widget\" data-e-type=\"widget\" data-widget_type=\"text-editor.default\">\n\t\t\t\t\u003Cdiv class=\"elementor-widget-container\">\n\t\t\t\t\t\t\t\t\t\u003Cdiv>\n\u003Ch5>Video poem and installation by Giacomo Marinsalta\u003Cbr data-start=\"303\" data-end=\"306\">Music by Lola Lextrait\u003Cbr>\u003Ci>\u003Cbr>\u003C/i>\u003Cp data-start=\"57\" data-end=\"192\">Can an everyday gesture and an ordinary object like laundry—typically excluded from the aesthetic gaze—reveal their own form of beauty?\u003C/p>\n\u003Cp data-start=\"194\" data-end=\"718\">The words of a poem accompany a life suspended between dream and reality, in a journey made of images of sheets and clothes hanging in the wind along the streets of a Mediterranean city.&nbsp;\u003Cbr>\u003Cbr>The evocative image of laundry blurs the boundaries between inside and outside, public and private. Through narrow alleys, balconies, and windows, the fabrics are transformed into language, architectural ornament, and a symbol of care and resistance, in contrast with an urban policy increasingly dominated by the aesthetics of decorum.\u003C/p>\n\u003Cp data-start=\"720\" data-end=\"951\">The project takes shape from the thesis research for the Master of Arts in European Media Studies at the University of Potsdam, entitled \u003Cem data-start=\"856\" data-end=\"951\">“Laundering Dreams in the Porous City – The Political Aesthetics of Laundry in Public Space.”\u003C/em>\u003C/p>\u003C/h5>\n\u003C/div>\ ounded in real climate science, Climate Fortunes is a web app that offers a glimpse into a future that is more certain than we might wish.&nbsp;\u003C/span>\u003C/h5>\n\u003Ch5>Developed during the Environmental Data, Media, and the Humanities Hackathon held from May 31 to June 2, 2023, in Potsdam, this project was organized by the Network of Digital Humanities at the University of Potsdam, in collaboration with Lukas Diestel, Maximilian Hepach, Giacomo Marinsalta, Sybille Neumeyer, Jonas Parnow, Birgit Schneider, and May Ee Wong. The initiative was funded by the Alexander von Humboldt Foundation, and the source code is available on&nbsp;\u003Cspan>\u003Ca href=\"https://github.com/jnsprnw/climate-horoscope\" target=\"_blank\" rel=\"noopener\">GitHub\u003C/a>\u003C/span>.\u003C/h5>\n\u003Ch5>Graphic Design\u003C/h5>\n\u003Ch4>\u003Cstrong>More info:&nbsp;\u003C/strong>\u003Ca href=\"https://climate-horoscope.netlify.app/\" target=\"_blank\" rel=\"noopener\">\u003Cu>Climate Fortunes\u003C/u>\u003C/a>\u003C/h4>\t\t\t\t\t\t\t\t\u003C/div>\n\t\t\t\t\u003C/div>\n\t\t\t\t\u003Cdiv class=\"elementor-element elementor-element-a39e6a5 elementor-widget elementor-widget-image\" data-id=\"a39e6a5\" data-element_type=\"widget\" data-e-type=\"widget\" data-widget_type=\"image.default\">\n\t\t\t\t\u003Cdiv class=\"elementor-widget-container\">\n\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\u003Cimg loading=\"lazy\" decoding=\"async\" width=\"1024\" height=\"538\" src=\"https://mete.fyi/wp-content/uploads/2024/09/Social_Image-1024x538.jpg\" class=\"attachment-large size-large wp-image-4448\" alt=\"\" srcset=\"https://mete.fyi/wp-content/uploads/2024/09/Social_Image-1024x538.jpg 1024w, https://mete.fyi/wp-content/uploads/2024/09/Social_Image-300x158.jpg 300w, https://mete.fyi/wp-content/uploads/2024/09/Social_Image-768x403.jpg 768w, https://mete.fyi/wp-content/uploads/2024/09/Social_Image.jpg 1200w\" sizes=\"(max-width: 1024px) 100vw, 1024px\" />\t\t\t\t\t\t\t\t\t\t\t\t\t\t\t\u003C/div>\n\t\t\t\t\ u003Cdiv class=\"elementor-widget-wrap\">\n\t\t\t\t\t\t\t\u003C/div>\n\t\t\u003C/div>\n\t\t\t\t\u003Cdiv class=\"elementor-column elementor-col-33 elementor-top-column elementor-element elementor-element-0d7ed34\" data-id=\"0d7ed34\" data-element_type=\"column\" data-e-type=\"column\" data-settings=\"{&quot;tmp_custom_cursor&quot;:&quot;disable&quot;}\">\n\t\t\t\u003Cdiv class=\"elementor-widget-wrap elementor-element-populated\">\n\t\t\t\t\t\t\u003Cdiv class=\"elementor-element elementor-element-260499f elementor-widget elementor-widget-heading\" data-id=\"260499f\" data-element_type=\"widget\" data-e-type=\"widget\" data-widget_type=\"heading.default\">\n\t\t\t\t\u003Cdiv class=\"elementor-widget-container\">\n\t\t\t\t\t\t\t\t\t\u003C/div>\n\t\t\t\t\u003C/div>\n\t\t\t\t\u003Cdiv class=\"elementor-element elementor-element-b3ce983 elementor-widget elementor-widget-spacer\" data-id=\"b3ce983\" data-element_type=\"widget\" data-e-type=\"widget\" data-widget_type=\"spacer.default\">\n\t\t\t\t\u003Cdiv class=\"elementor-widget-container\">\n\t\t\t\t\t\t\t\u003Cdiv class=\"elementor-spacer\">\n\t\t\t\u003Cdiv class=\"elementor-spacer-inner\">\u003C/div>\n\t\t\u003C/div>\n\t\t\t\t\t\t\u003C/div>\n\t\t\t\t\u003C/div>\n\t\t\t\t\u003Cdiv class=\"elementor-element elementor-element-2409dae elementor-widget-tablet__width-initial elementor-widget elementor-widget-text-editor\" data-id=\"2409dae\" data-element_type=\"widget\" data-e-type=\"widget\" data-widget_type=\"text-editor.default\">\n\t\t\t\t\u003Cdiv class=\"elementor-widget-container\">\n\t\t\t\t\t\t\t\t\t\u003Ch5>Featured in \u003Cspan>\u003Ca href=\"https://shop.tlon.it/prodotto/queer-pandemia-contaminazioni-artistiche-di-altro-genere/\" target=\"_blank\" rel=\"noopener\">\u003Ci>Queerpandemia &#8211; Contaminazioni artistische di altro genere\u003C/i>\u003C/a>\u003C/span> (Tlon 2024), \u003Ci>Wicked Games &#8211; For a Morphology of Gestures \u003C/i>presents an artwork series, in which movement is represented as spasmodic response of the body to the pervasiveness of digitization.\u003C/h5>\u003Ch5>During the pandemic the invisible agent of the virus has exacerbated a fear intimately connected to bodies, projecting the possibility of death into media and news. A cosmic void serves behind our gestures as the backdrop to a feeling of meaninglessness we all felt somehow during this time.\u003C/h5>\u003Ch5>The impoverishment of the meaning of images dictated by their constant consumption, in a continuous virtual flow, has led to an artistic contemplation of the physical qualities of the mineral world, whose incredibly slow crystalline transformations remain on the contrary imperceptible to human scrutiny. These creations occur over millennia through inconspicuous changes in accidental terrestrial conditions. The natural phenomena of material change affecting minerals create evocative forms and signs, capturing the human eye. Hands move randomly to the glitched impression of the machine. Skin is joined by stone as an excrescence of the world, with textures interweaving with objects and their appearances, in the rhythm of a common cosmic becoming.\u003C/h5>\u003Cdiv>\u003Cdiv>\u003Ch5>Visual Art\u003C/h5>\u003Ch5>\u003Cb>More info:\u003C/b> \u003Ca href=\"https://ultraqueer.it/\" target=\"_blank\" rel=\"noopener\">\u003Cu>Queerpandemia\u003C/u>\u003C/a>\u003C/h5>\u003C/div>\u003C/div>\t\t\t\t\t\t\t\t\u003C/div>\n\t\t\t\t\u003C/div>\n\t\t\t\t\t\u003C/div>\n\t\t\u003C/div>\n\t\t\t\t\u003Cdiv class=\"elementor-column elementor-col-33 elementor-top-column elementor-element elementor-element-806b821\" data-id=\"806b821\" data-element_type=\"column\" data-e-type=\"column\" data-settings=\"{&quot;tmp_custom_cursor&quot;:&quot;disable&quot;}\">\n\t\t\t\u003Cdiv class=\"elementor-widget-wrap\">\n\t\t\t\t\t\t\t\u003C/div>\n\t\t\u003C/div>\n\t\t\t\t\t\u003C/div>\n\t\t\u003C/section>\n\t\t\t\t\u003Csection class=\"elementor-section elementor-top-section elementor-element elementor-element-7e1ce t\t\t\t\u003C/div>\n\t\t\t\t\t\u003C/div>\n\t\t\u003C/div>\n\t\t\t\t\t\u003C/div>\n\t\t\u003C/section>\n\t\t\t\t\u003Csection class=\"elementor-section elementor-top-section elementor-element elementor-element-0ca6acf elementor-section-full_width elementor-section-stretched elementor-section-height-default elementor-section-height-default\" data-id=\"0ca6acf\" data-element_type=\"section\" data-e-type=\"section\" data-settings=\"{&quot;stretch_section&quot;:&quot;section-stretched&quot;,&quot;tmp_custom_cursor&quot;:&quot;disable&quot;}\">\n\t\t\t\t\t\t\u003Cdiv class=\"elementor-container elementor-column-gap-default\">\n\t\t\t\t\t\u003Cdiv class=\"elementor-column elementor-col-33 elementor-top-column elementor-element elementor-element-de63b26\" data-id=\"de63b26\" data-element_type=\"column\" data-e-type=\"column\" data-settings=\"{&quot;tmp_custom_cursor&quot;:&quot;disable&quot;}\">\n\t\t\t\u003Cdiv class=\"elementor-widget-wrap\">\n\t\t\t\t\t\t\t\u003C/div>\n\t\t\u003C/div>\n\t\t\t\t\u003Cdiv class=\"elementor-column elementor-col-33 elementor-top-column elementor-element elementor-element-56721b3\" data-id=\"56721b3\" data-element_type=\"column\" data-e-type=\"column\" data-settings=\"{&quot;tmp_custom_cursor&quot;:&quot;disable&quot;}\">\n\t\t\t\u003Cdiv class=\"elementor-widget-wrap elementor-element-populated\">\n\t\t\t\t\t\t\u003Cdiv class=\"elementor-element elementor-element-f5d4f0d elementor-widget elementor-widget-heading\" data-id=\"f5d4f0d\" data-element_type=\"widget\" data-e-type=\"widget\" data-widget_type=\"heading.default\">\n\t\t\t\t\u003Cdiv class=\"elementor-widget-container\">\n\t\t\t\t\t\t\t\t\t\u003C/div>\n\t\t\t\t\u003C/div>\n\t\t\t\t\u003Cdiv class=\"elementor-element elementor-element-38a3daa elementor-widget elementor-widget-spacer\" data-id=\"38a3daa\" data-element_type=\"widget\" data-e-type=\"widget\" data-widget_type=\"spacer.default\">\n\t\t\t\t\u003Cdiv class=\"elementor-widget-container\">\n\t\t\t\t\t\t\t\u003Cdiv class=\"elementor-spacer\">\n\t\t\t\u003Cdiv class=\"elementor-spacer-inner\">\u003C/div>\n\t\t\u003C/div>\n\t\t\t\t\t\t\u003C/div>\n\t\t\t\t\u003C/div>\n\t\t\t\t\u003Cdiv class=\"elementor-element elementor-element-1088da3 elementor-widget-tablet__width-initial elementor-widget-mobile__width-inherit elementor-widget elementor-widget-text-editor\" data-id=\"1088da3\" data-element_type=\"widget\" data-e-type=\"widget\" data-widget_type=\"text-editor.default\">\n\t\t\t\t\u003Cdiv class=\"elementor-widget-container\">\n\t\t\t\t\t\t\t\t\t\u003Cdiv class=\"project__abstract project__block s-text\">\n\u003Ch5>\u003Cem>Excuse Us While We Improve Your View, Atlantis\u003C/em> is a video installation featuring an experimental film on the 2022 World Exposition in Dubai.\u003C/h5>\n\u003Ch5>The film draws inspiration from Plato&#8217;s myth of the lost island empire of Atlantis, which sank undersea at the peak of its civilization and ideal state power. The installation translates Atlantis&#8217; mythical imagery into the aesthetics of Dubai&#8217;s international free trade zones, luxury real estate, and World Exposition sightseeing, symbolizing new social orders and frontiers for state-of-the-art cosmopolitan urbanism. Through a blend of commercial spots and personal travel recordings capturing a journey through the metropolis until the Expo&#8217;s venue, the visual research documents the world representation mediated by Expo &#8211; a &#8220;worldling&#8221; &#8211; blurring the line between reality and fiction.\u003C/h5>\n\u003Ch5>Atlantis becomes a legendary tourist destination, reflecting a Western tendency to romanticize and exoticize faraway lands, perpetuating an othering and voyeuristic gaze, allured by the realization of an unknown elsewhere. The narrative unfolds within a surveilled, enclosed, and transient fair, where political expression is marginalized. Passports transform into branded gadgets, serving as symbols of manufactured global contact, creating an illusion of an external reality with equal freedom of movement for all.\u003C/h5>\n\u003Ch5>Immersive experiences, idealistic rhetoric on sustainability, and promises of &#8220;real-world&#8221; solutions simulate a worldly narrative, enchanting virtual visitors and passenger spectators alike. Whether envisioned as a utopian „island of the blessed,“ an oasis amidst the desert, or a distant land on the horizon of the sea, Atlantis remains a mirage, an elusive vision of progress woven with nationalist dreams, an incessant stream of virtual landscapes, whose &#8216;concrete&#8217; realization continually seeks to be improved and perfected.\u003C/h5>\n\u003C/div>\n\u003Ch5>Music by Aïna Spencer\u003C/h5>\n\u003Ch5>\u003Cem>Excuse Us While We Improve Your View Atlantis was exhibited in the conference &#8220;Un/Reale Interaktionsräume&#8221; funded by the program „Digital Realities“ by ZEM, in November 2022 at the FH Potsdam.&nbsp;\u003C/em>\u003C/h5>\n\u003Ch5>&nbsp;\u003C/h5>\n\u003Ch5>\u003Cstrong>More info: \u003C/strong>\u003Cspan>Un/Reale Interaktionsräume\u003C/span>\u003C/h5>\t\t\t\t\t\t\t\t\u003C/div>\n\t\t\t\t\u003C/div>\n\t\t\t\t\t\u003C/div>\n\t\t\u003C/div>\n\t\t\t\t\u003Cdiv class=\"elementor-column elementor-col-33 elementor-top-column elementor-element elementor-element-58c02e1\" data-id=\"58c02e1\" data-element_type=\"column\" data-e-type=\"column\" data-settings=\"{&quot;tmp_custom_cursor&quot;:&quot;disable&quot;}\">\n\t\t\t\u003Cdiv class=\"elementor-widget-wrap\">\n\t\t\t\t\t\t\t\u003C/div>\n\t\t\u003C/div>\n\t\t\t\t\t\u003C/div>\n\t\t\u003C/section>\n\t\t\t\t\u003Csection class=\"elementor-section elementor-top-section elementor-element elementor-element-5e02729 elementor-section-boxed elementor-section-height-default elementor-section-height-default\" data-id=\"5e02729\" data-element_type=\"section\" data-e-type=\"section\" data-settings=\"{&quot;tmp_custom_cursor&quot;:&quot;disable&quot;}\">\n\t\t\t\t\t\t\u003Cdiv class=\"elementor-container elementor-column-gap-de ment-7f6a5cf elementor-widget-tablet__width-initial elementor-widget elementor-widget-text-editor\" data-id=\"7f6a5cf\" data-element_type=\"widget\" data-e-type=\"widget\" data-widget_type=\"text-editor.default\">\n\t\t\t\t\u003Cdiv class=\"elementor-widget-container\">\n\t\t\t\t\t\t\t\t\t\u003Ch5> \u003C/h5>\u003Ch5>Offener Kanal Europa took over a former Imbiss in the summer of 2020, located in the privatized neighborhood of Europacity in Berlin. Designed in the shape of a birdhouse, it served as a studio for a mobile TV channel and hosted various events. The first series of interviews posed questions such as:\u003Cbr />\u003Cstrong>\u003Cbr />\u003C/strong>What moves Europacity?\u003Cbr />What should the neighborhood look like in the future?\u003Cbr />How is public space changing?\u003C/h5>\u003Ch5>Watch the first TV Channel of Europacity, Berlin:\u003Cbr />\u003Cspan>\u003Cstrong>\u003Ca href=\"https://www.youtube.com/watch?time_continue=2&amp;v=AMc50WKHr7U&amp;embeds_referring_euri=https%3A%2F%2Foffener-kanal.eu%2F&amp;source_ve_path=MjM4NTE\">Youtube\u003C/a>\u003C/strong>\u003C/span>\u003C/h5>\t\t\t\t\t\t\t\t\u003C/div>\n\t\t\t\t\u003C/div>\n\t\t\t\t\u003Cdiv class=\"elementor-element elementor-element-f0d6a0b elementor-widget elementor-widget-heading\" data-id=\"f0d6a0b\" data-element_type=\"widget\" data-e-type=\"widget\" data-widget_type=\"heading.default\">\n\t\t\t\t\u003Cdiv class=\"elementor-widget-container\">\n\t\t\t\t\t\u003Ch2 class=\"elementor-heading-title elementor-size-default\">\u003Cstrong>Die Stadt als Papier Denken\u003Cbr>\nPerformance in Public Space\u003C/h2>\t\t\t\t\u003C/div>\n\t\t\t\t\u003C/div>\n\t\t\t\t\u003Cdiv class=\"elementor-element elementor-element-36a007d elementor-widget elementor-widget-spacer\" data-id=\"36a007d\" data-element_type=\"widget\" data-e-type=\"widget\" data-widget_type=\"spacer.default\">\n\t\t\t\t\u003Cdiv class=\"elementor-widget-container\">\n\t\t\t\t\t\t\t\u003Cdiv class=\"elementor-spacer\">\n\t\t\t\u003Cdiv class=\"elementor-spacer-inner\">\u003C/div>\n\t\t\u003C/div>\n\t\t\t\t\t\t\u003C/div>\n\t\t\t\t\u003C/div>\n\t\t\t\t\u003Cdiv class=\"elementor-element elementor-element-01c1103 elementor-widget elementor-widget-text-editor\" data-id=\"01c1103\" data-element_type=\"widget\" data-e-type=\"widget\" data-widget_type=\"text-editor.default\">\n\t\t\t\t\u003Cdiv class=\"elementor-widget-container\">\n\t\t\t\t\t\t\t\t\t\u003Ch5>To celebrate the publishing of the fanzine \u003Cem>Lothars Reise \u003C/em>the Offener Kanal Europa organized in August 2021 an artistic performance in public space titled \u003Ci>Die Stadt als Papier Denken\u003C/i>. \u003Cbr />Through a mobile DYI station the performance saw passerbies of the streets of Europacity, Berlin cutting and folding the zines. \u003Cbr />\u003Cem>\u003Cbr />Lothars Letzte Reise \u003C/em>tells the story of a old neighbor of Wedding visiting for the first time the district of Europacity. Old and new contrasts emerge in what used to be and what will become the city. The fanzine was published by ZNAAACKS.\u003C/h5>\t\t\t\t\t\t\t\t\u003C/div>\n\t\t\t\t\u003C/div>\n\t\t\t\t\u003Cdiv class=\"elementor-element elementor-element-e6bbd01 elementor-widget elementor-widget-spacer\" data-id=\"e6bbd01\" data-element_type=\"widget\" data-e-type=\"widget\" data-widget_type=\"spacer.default\">\n\t\t\t\t\u003Cdiv class=\"elementor-widget-container\">\n\t\t\t\t\t\t\t\u003Cdiv class=\"elementor-spacer\">\n\t\t\t\u003Cdiv class=\"elementor-spacer-inner\">\u003C/div>\n\t\t\u003C/div>\n\t\t\t\t\t\t\u003C/div>\n\t\t\t\t\u003C/div>\n\t\t\t\t\t\u003C/div>\n\t\t\u003C/div>\n\t\t\t\t\u003Cdiv class=\"elementor-column elementor-col-33 elementor-top-column elementor-element elementor-element-58c02e1\" data-id=\"58c02e1\" data-element_type=\"column\" data-e-type=\"column\" data-settings=\"{&quot;tmp_custom_cursor&quot;:&quot;disable&quot;}\">\n\t\t\t\u003Cdiv class=\"elementor-widget-wrap\">\n\t\t\t\t\t\t\t\u003C/div>\n\t\t\u003C/div>\n\t\t\t\t\
