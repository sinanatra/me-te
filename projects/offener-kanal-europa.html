t:"\u003Cp class=\"p1\">Curation of \u003Ci>Un/Reale Interaktionsräume\u003C/i>, a conference, exhibition and publication (transcript, 2025).\u003C/p>\n",categories:["curation","visual","writing"],cover:o,images:[o],links:[{href:"https://www.zem-brandenburg.de/veranstaltungen/graduiertentagung-2022/",label:"zem-brandenburg.de"}],externalUrl:null,videos:[],detail:false},{id:6226,slug:"sinchronicity",title:"Sinchronicity",date:null,excerpt:"\u003Cp class=\"p1\">Graphic design for \u003Ci>Sinchronicity\u003C/i>, a music sample pack by Alix Laing for Schertler Audio.\u003C/p>\n",content:"\u003Cp class=\"p1\">Graphic design for \u003Ci>Sinchronicity\u003C/i>, a music sample pack by Alix Laing for Schertler Audio.\u003C/p>\n",categories:["visual"],cover:p,images:[p],links:[{href:"https://www.schertler.com",label:"schertler.com"}],externalUrl:null,videos:[],detail:false},{id:6225,slug:"series-of-existence-w-alix",title:"Series of Existence w/ Alix",date:null,excerpt:"\u003Cp class=\"p1\">Graphic design for \u003Ci>Series of Existence\u003C/i>, Alix’s show on Bauhui radio.\u003C/p>\n",content:"\u003Cp class=\"p1\">Graphic design for \u003Ci>Series of Existence\u003C/i>, Alix’s show on Bauhui radio.\u003C/p>\n",categories:["visual"],cover:q,images:[q],links:[{href:"https://baihui.live/shows/series-of-existence-w-alix-21-10-17/en/",label:"baihui.live"}],externalUrl:null,videos:[],detail:false},{id:6224,slug:"alex-urso",title:"Alex Urso",date:null,excerpt:"\u003Cp class=\"p1\">Website for Alex Urso, multidisciplinary artist and curator.\u003C/p>\n",content:"\u003Cp class=\"p1\">Website for Alex Urso, multidisciplinary artist and curator.\u003C/p>\n",categories:["web"],cover:r,images:[r],links:[{href:"https://alexurso.com/",label:"alexurso.com"}],externalUrl:null,videos:[],detail:false},{id:6223,slug:"offener-kanal-europa",title:"Offener Kanal Europa",date:"Since 2020",excerpt:"\u003Cp class=\"p1\">Visual identity, website and curation for Offener Kanal Europa, a media platform and collective that began in 2020 as a TV channel in a former snack kiosk in Berlin’s Europacity, and that has since documented, through interviews and artistic actions, how urban privatisation reshapes the city.\u003C/p>\n",content:"\u003Cp dir=\"ltr\">Offener Kanal Europa is a media platform and series of interventions in public space, initiated by Nora Spiekermann in collaboration with Giacomo Marinsalta and active in Berlin since 2020. Through interviews and street-level artistic and community-led actions, it documents how the financialisation of urban space, especially the privatisation of real estate, is transforming the city.\u003C/p>\n\u003Cp dir=\"ltr\">The project began in summer 2020, when Offener Kanal Europa took over a former \u003Cem>Imbiss\u003C/em> (snack kiosk) in Europacity, a privately developed neighbourhood in Berlin. The birdhouse-shaped kiosk became the studio of a mobile TV channel and hosted a range of events. The first series of interviews asked: What moves Europacity? What should the neighbourhood look like in the future? How is public space changing? Watch the first TV channel of Europacity, Berlin, \u003Ca href=\"https://www.youtube.com/watch?v=AMc50WKHr7U\">here\u003C/a>.\u003C/p>\n\u003Cp class=\"p1\">\u003Cb>\u003Cbr />\nDie Stadt als Papier denken\u003C/b>\u003C/p>\n\u003Cp class=\"p2\">\u003Ci>Performance in public space\u003C/i>\u003Ci>\u003C/i>\u003C/p>\n\u003Cp class=\"p2\">In August 2021, to celebrate the publication of the fanzine \u003Ci>Lothars letzte Reise\u003C/i>, Offener Kanal Europa organised \u003Ci>Die Stadt als Papier denken\u003C/i>, a performance in public space. At a mobile DIY station, passers-by in the streets of Europacity cut and folded the zines themselves.\u003C/p>\n\u003Cp class=\"p2\">\u003Ci>Lothars letzte Reise\u003C/i> tells the story of an elderly resident of Wedding visiting the Europacity district for the first time. Contrasts emerge between what the city used to be and what it is becoming. The fanzine was published by ZNAAACKS Publications.\u003C/p>\n\u003Cp class=\"p2\">Photos © Valentina Ferrari\u003C/p>\n\u003Ch5>\u003C/h5>\n\u003Cp class=\"p1\">\u003Cb>How to Make Europacity\u003C/b>\u003C/p>\n\u003Cp class=\"p2\">A satirical audio piece advertising a “how-to” workshop, which exposes the language and visions of the future promoted by today’s real estate industry. Listen \u003Ca href=\"https://offener-kanal.eu/wp-content/uploads/2021/12/1PaperCity_HowToMakeACity.mp3\">here\u003C/a>.\u003C/p>\n\u003Cp class=\"p2\">Music by GiGi FM\u003Cbr />\n\u003Cspan>Words and voice by Giacomo Marinsalta\u003C/span>\u003C/p>\n\u003Cp>&nbsp;\u003C/p>\n\u003Cp class=\"p1\">\u003Cb>Europacity Vakuum\u003C/b>\u003C/p>\n\u003Cp class=\"p2\">Poster and flyer design for \u003Ci>Europacity Vakuum\u003C/i> (2022), a small public festival set up to counter the often empty streets of Europacity. Open to residents and anyone interested, the event featured artistic interventions, performances, discovery tours and projections, along with two panel discussions. Find more information on the events \u003Ca href=\"https://offener-kanal.eu/#europacityvakuum\">here\u003C/a>.\u003C/p>\n\u003Cp class=\"p2\">Photos © Konstanze Flamme\u003C/p>\n\u003Cp>&nbsp;\u003C/p>\n\u003Cp>\u003Cstrong>Publications\u003C/strong>\u003C/p>\n\u003Cp>Offener Kanal Europa has also reflected on its practice in writing.\u003Cbr />\n“\u003Cem>\u003Ca href=\"https://reimaginecity.org/projects/reimagine-your-city-rethinking-urban-paradigms/\">Holes for Sale: On Contemporary City Planning in Berlin\u003C/a>\u003C/em>” was published in \u003Cem>Re-Imagine Your City\u003C/em> (eds. K. Romanova and A. Zhuravel, Berlin 2023), and “\u003Cem>\u003Ca href=\"https://etherport.org/publications/inc/Tactical_Media_Reader/chapters/can-a-tv-channel-save-public-access.html\">Can a TV Channel Save Public Access?\u003C/a>\u003C/em>” appears in \u003Cem>Fragments of Tactical Media\u003C/em>, published by the Institute of Network Cultures (Amsterdam, 2026).\u003C/p>\n",categories:["curation","visual","web"],cover:{src:"https://mete.fyi/wp-content/uploads/2024/09/AnimationOKE.gif",thumb:"https://mete.fyi/wp-content/uploads/2024/09/AnimationOKE.gif",alt:"Offener Kanal Europa",width:800,height:467},images:[{src:"https://mete.fyi/wp-content/uploads/2024/10/Website_Homepage.jpg",thumb:"https://mete.fyi/wp-content/uploads/2024/10/Website_Homepage-768x512.jpg",alt:"Offener Kanal Europa",width:2000,height:1333},{src:"https://mete.fyi/wp-content/uploads/2024/10/Terrasse_OKE.jpg",thumb:"https://mete.fyi/wp-content/uploads/2024/10/Terrasse_OKE-768x512.jpg",alt:"Offener Kanal Europa",width:1000,height:667},{src:"https://mete.fyi/wp-content/uploads/2025/01/L1050963.jpg",thumb:"https://mete.fyi/wp-content/uploads/2025/01/L1050963-768x432.jpg",alt:"Offener Kanal Europa",width:1600,height:900},{src:"https://mete.fyi/wp-content/uploads/2024/10/L1050907.jpg",thumb:"https://mete.fyi/wp-content/uploads/2024/10/L1050907-768x432.jpg",alt:"Offener Kanal Europa",width:1600,height:900},{src:"https://mete.fyi/wp-content/uploads/2025/01/L1050893.jpg",thumb:"https://mete.fyi/wp-content/uploads/2025/01/L1050893-768x1365.jpg",alt:"Offener Kanal Europa",width:900,height:1600},{src:"https://mete.fyi/wp-content/uploads/2024/10/L1050914-scaled.jpg",thumb:"https://mete.fyi/wp-content/uploads/2024/10/L1050914-768x432.jpg",alt:"Offener Kanal Europa",width:1920,height:1080},{src:"https://mete.fyi/wp-content/uploads/2024/10/L1050857x-scaled.jpg",thumb:"https://mete.fyi/wp-content/uploads/2024/10/L1050857x-768x450.jpg",alt:"Offener Kanal Europa",width:1920,height:1126},{src:"https://mete.fyi/wp-content/uploads/2025/01/L1050991.jpg",thumb:"https://mete.fyi/wp-content/uploads/2025/01/L1050991-768x432.jpg",alt:"Offener Kanal Europa",width:1600,height:900},{src:"https://mete.fyi/wp-content/uploads/2024/10/L1060012.jpg",thumb:"https://mete.fyi/wp-content/uploads/2024/10/L1060012-768x432.jpg",alt:"Offener Kanal Europa",width:1600,height:900} akuum",label:"here"},{href:"https://reimaginecity.org/projects/reimagine-your-city-rethinking-urban-paradigms/",label:"Holes for Sale: On Contemporary City Planning in Berlin"},{href:"https://etherport.org/publications/inc/Tactical_Media_Reader/chapters/can-a-tv-channel-save-public-access.html",label:"Can a TV Channel Save Public Access?"}],externalUrl:null,videos:["https://www.youtube-nocookie.com/embed/AMc50WKHr7U"],detail:true},{id:6222,slug:"society-for-mutual-appreciation",title:"Society for Mutual Appreciation",date:null,excerpt:s,content:s,categories:["web"],cover:t,images:[t],links:[{href:"https://olgahohmann.com/",label:"olgahohmann.com"}],externalUrl:null,videos:[],detail:false},{id:6221,slug:"disruption-network-lab",title:"Disruption Network Lab",date:null,excerpt:u,content:u,categories:["curation"],cover:v,images:[v],links:[{href:"https://www.disruptionlab.org/",label:"disruptionlab.org"}],externalUrl:null,videos:[],detail:false},{id:6220,slug:"radio-choreography",title:"Radio-Choreography",date:null,excerpt:"\u003Cp class=\"p1\">Graphic and web design for \u003Ci>Radio-Choreography\u003C/i>, an artistic research project by Netta Weiser.\u003C/p>\n",content:"\u003Cp class=\"p1\">Graphic and web design for \u003Ci>Radio-Choreography\u003C/i>, an artistic research project by Netta Weiser.\u003C/p>\n",categories:["visual","web"],cover:w,images:[w],links:[{href:"https://radio-choreography.net/",label:"radio-choreography.net"}],externalUrl:null,videos:[],detail:false},{id:6219,slug:"cheerful-weaves-laboratory-for-joyful-dependencies",title:"Cheerful Weaves: Laboratory for Joyful Dependencies",date:"2021",excerpt:"\u003Cp class=\"p1\">A documentary film on a week-long residency that experimented with collective practices of care, taking place at Libken, in Gerswalde, Germany in 2021.\u003C/p>\n",content:"\u003Cp class=\"p1\">Growing out of conversations and reflections shared since spring 2020, \u003Ci>Cheerful Weaves – Labor für gelungene Abhängigkeiten\u003C/i> (tr. Laboratory for Joyful Dependencies) was a self-organised process for reflecting on and experimenting with collective practices of care.\u003Cbr />\nAs the pandemic unfolded, close exchanges between friends awakened a joyful, militant wish to explore the mutual responsibilities and needs we share in caring for, with, of and about each other, while holding a critical stance towards the structures of power and domination that shape society.\u003C/p>\n\u003Cp class=\"p1\">\u003Ci>Cheerful Weaves\u003C/i> took place at Libken e.V. from 12 to 19 September 2021, with a week-long residency for invited artists Olga Golde, Ronald Berger, Giulia Claudia Massacci, Marina Prados, Paula Knüpling and Kaitlin Fisher.\u003C/p>\n\u003Cp class=\"p1\">In collaboration with Libken e.V., Paula Becker, Louis Mauff and Kim Sanou.\u003Cbr />\nFunded by the Kulturstiftung des Bundes.\u003C/p>\n",categories:["curation","video","visual"],cover:{src:"https://mete.fyi/wp-content/uploads/2024/09/cheerfulweaves-1-600x.jpg",thumb:"https://mete.fyi/wp-content/uploads/2024/09/cheerfulweaves-1-600x.jpg",alt:"Cheerful Weaves: Laboratory for Joyful Dependencies",width:600,height:333},images:[{src:"https://mete.fyi/wp-content/uploads/2025/01/R1-02961-0021.jpg",thumb:"https://mete.fyi/wp-content/uploads/2025/01/R1-02961-0021-768x515.jpg",alt:"Cheerful Weaves: Laboratory for Joyful Dependencies",width:1600,height:1073},{src:"https://mete.fyi/wp-content/uploads/2025/01/Cheerful_Weaves_Mappe.jpg",thumb:"https://mete.fyi/wp-content/uploads/2025/01/Cheerful_Weaves_Mappe-768x543.jpg",alt:"Cheerful Weaves: Laboratory for Joyful Dependencies",width:1600,height:1131}],links:[{href:"https://libken.de/",label:"libken.de"}],externalUrl:null,videos:["https://www.youtube-nocookie.com/embed/gHtEpYWSJrc"],detail:true},{id:6218,slug:"excuse-us-while-we-improve-your-view-atlantis",title:"Excuse Us While We Improve Your View, Atlantis",date:"2023",excerpt:"\u003Cp class=\"p1\">A video installation that reads Expo 2020 Dubai through Plato’s myth of Atlantis.\u003C/p>\n",content:"\u003Cp class=\"p1\">\u003Ci>Excuse Us While We Improve Your View, Atlantis\u003C/i> is a video installation built around an experimental film on Expo 2020 Dubai, the world exposition held in 2021–2022.\u003C/p>\n\u003Cp class=\"p1\">The film draws on Plato’s myth of Atlantis, the island empire that sank beneath the sea at the height of its civilisation and power. The installation translates the mythical imagery of Atlantis into the aesthetics of Dubai’s free trade zones, luxury real estate and Expo sightseeing, as symbols of new social orders and new frontiers of cosmopolitan urbanism. Combining commercials with personal travel footage of a journey through the city to the Expo site, the work examines how the Expo represents the world – a form of “worlding” – blurring the line between reality and fiction.\u003C/p>\n\u003Cp class=\"p1\">Atlantis becomes a legendary tourist destination, reflecting a Western tendency to romanticise and exoticise faraway places, and an othering, voyeuristic gaze drawn to the promise of an unknown elsewhere. The narrative unfolds within a surveilled, enclosed and temporary fair where political expression is pushed to the margins. Passports become branded souvenirs, symbols of a manufactured global encounter that suggests everyone shares the same freedom of movement.\u003C/p>\n\u003Cp class=\"p1\">Immersive experiences, idealistic rhetoric on sustainability and promises of “real-world” solutions stage a worldly narrative that enchants virtual visitors and passing spectators alike. Whether imagined as a utopian “island of the blessed”, an oasis in the desert or a distant land on the horizon, Atlantis remains a mirage: an elusive vision of progress woven with nationalist dreams and an incessant stream of virtual landscapes, whose “concrete” realisation is forever being improved and perfected.\u003C/p>\n\u003Cp>Video and installation by Giacomo Marinsalta\u003Cbr />\nMusic by Aïna Spencer\u003C/p>\n\u003Cp>The installation was exhibited at the conference Un/Reale Interaktionsräume at FH Potsdam in November 2022, funded by the ZEM programme “Digital Realities”. An essay on the work appears in the publication of the same name, \u003Cem>Un/Reale Interaktionsräume\u003C/em> (transcript Verlag, 2025).\u003C/p>\n",categories:["video"],cover:{src:"https://mete.fyi/wp-content/uploads/2024/09/IMG_0890-e1726840077393.jpg",thumb:"https://mete.fyi/wp-content/uploads/2024/09/IMG_0890-768x512.jpg",alt:"Excuse Us While We Improve Your View, Atlantis",width:1000,height:667},images:[{src:"https://mete.fyi/wp-content/uploads/2025/01/IMG_0890.jpg",thumb:"https://mete.fyi/wp-content/uploads/2025/01/IMG_0890-768x512.jpg",alt:"Excuse Us While We Improve Your View, Atlantis",width:1600,height:1067},{src:"https://mete.fyi/wp-content/uploads/2025/01/IMG_0870.jpg",thumb:"https://mete.fyi/wp-content/uploads/2025/01/IMG_0870-768x512.jpg",alt:"Excuse Us While We Improve Your View, Atlantis",width:1600,height:1067},{src:"https://mete.fyi/wp-content/uploads/2025/01/IMG_2091.jpg",thumb:"https://mete.fyi/wp-content/uploads/2025/01/IMG_2091-768x1148.jpg",alt:"Excuse Us While We Improve Your View, Atlantis",width:1070,height:1600},{src:"https://mete.fyi/wp-content/uploads/2025/01/IMG_0892.jpg",thumb:"https://mete.fyi/wp-content/uploads/2025/01/IMG_0892-768x512.jpg",alt:"Excuse Us While We Improve Your View, Atlantis",width:1600,height:1067},{src:"https://mete.fyi/wp-content/uploads/2025/01/IMG_0850.jpg",thumb:"https://mete.fyi/wp-content/uploads/2025/01/IMG_0850-768x512.jpg",alt:"Excuse Us While We Improve Your View, Atlantis",width:1280,height:853},{src:"https://mete.fyi/wp-content/uploads/2025/01/IMG_2148.jpg",thumb:"https://mete.fyi/wp-content/uploads/2025/01/IMG_2148-768x512.jpg",alt:"Excuse Us While We Improve Your View, Atlantis",width:1280,height:853}],links:[{href:"https://www.transcript-open.de/doi/10.14361/9783839471463-011",label:"transcript-open.de"}],externalUrl:null,videos:["https://www.youtube-nocookie.com/embed/eSG-LC_ljwA"],detail:true},{id:6217,slug:"santana-studio-art-and-ceramic",title:"Santana Studio – Art and Ceramic",date:null,excerpt:"\u003Cp class=\"p1\">Graphic visualisations of ceramic tiles for Santana Studio.\u003C/p>\n",content:"\u003Cp class=\"p1\">Graphic visualisations of ceramic tiles for Santana Studio.\u003C/p>\n",categories:["visual"],cover:x,images:[x],links:[{href:"https://www.ateliersantana.com/studio/",label:"ateliersantana.com"}],externalUrl:null,videos:[],detail:false},{id:6215,slug:"carly-lave",title:"Carly Lave\u2028",date:null,excerpt:"\u003Cp class=\"p1\">Website for Carly Lave, choreographer, performer and digital designer.\u003C/p>\n",content:"\u003Cp class=\"p1\">Website for Carly Lave, choreographer, performer and digital designer.\u003C/p>\n",categories:["web"],cover:y,images:[y],links:[{href:"https://carlylave.com/",label:"carlylave.com"}],externalUrl:null,videos:[],detail:false},{id:6214,slug:"alles-anders-tv",title:"Alles Anders TV\u2028",date:"2022",excerpt:"\u003Cp class=\"p1\">A six-episode street interview series and a live performance on life around Alexanderplatz, made with Nora Spiekermann for the Haus der Statistik in Berlin as part of the collective Offener Kanal Europa.\u003C/p>\n",content:"\u003Cp class=\"p1\">In 2022, the Offener Kanal Europa collective explored the neighbourhood around Alexanderplatz as part of the open call \u003Ci>gemeinsam um die Häuser ziehen\u003C/i>, launched by the \u003Ca href=\"https://hausderstatistik.org/\">Haus der Statistik\u003C/a>.\u003C/p>\n\u003Cp class=\"p1\">Nora Spiekermann and Giacomo Marinsalta asked passers-by: What is it like to live right on Alexanderplatz? Do people know about the Haus der Statistik? What value does the project hold for the city centre?\u003C/p>\n\u003Cp class=\"p1\">Their research led to a large live broadcast on the street in front of the Haus der Statistik, a six-episode interview series titled \u003Ci>Alles Anders TV\u003C/i>, and two performative tours of the neighbourhood. \u003Ci>Alles Anders TV\u003C/i> was broadcast by the TV station and media platform \u003Ca href=\"https://www.alex-berlin.de/\">ALEX Berlin\u003C/a>.\u003C/p>\n\u003Cp class=\"p1\">\u003Cb>\u003Cbr />\nLive Intervention Release Tour\u003C/b>\u003C/p>\n\u003Cp class=\"p2\">13 July 2023 · Photos © Giacomo Marinsalta\u003C/p>\n\u003Cp class=\"p1\">\u003Cb>\u003Cbr />\nExpedition Alles Anders Platz\u003C/b>\u003C/p>\n\u003Cp class=\"p3\">Part of the Kultursommer Festival, 21 July 2023 · Photos © Giacomo Marinsalta\u003C/p>\n\u003Cp>\u003Cb>\u003C/b>Production: Giacomo Marinsalta and Nora Spiekermann\u003Cbr />\nIn collaboration with Entäusche Mich Nicht\u003Cbr />\nJingles and sound: Aïna Spencer\u003Cbr />\nCamera and editing: Giacomo Marinsalta\u003Cbr />\nInterviews and performance: Nora Spiekermann\u003Cbr />\nFunded by: ZUsammenKUNFT\u003C/p>\n",categories:["curation","video","visual"],cover:{src:"https://mete.fyi/wp-content/uploads/2023/01/OKE.gif",thumb:"https://mete.fyi/wp-content/uploads/2023/01/OKE.gif",alt:"Alles Anders TV\u2028",width:600,height:338},images:[{src:"https://mete.fyi/wp-content/uploads/2024/10/Post_AATV-copy.jpg",thumb:"https://mete.fyi/wp-content/uploads/2024/10/Post_AATV-copy.jpg",alt:"Alles Anders TV\u2028",width:732,height:732},{src:"https://mete.fyi/wp-content/uploads/2024/10/FLYER_LIVETOUR-min-min.jpg",thumb:"https://mete.fyi/wp-content/uploads/2024/10/FLYER_LIVETOUR-min-min-768x994.jpg",alt:"Alles Anders TV\u2028",width:1500,height:1941},{src:"https://mete.fyi/wp-content/uploads/2024/10/IMG_0330.jpg",thumb:"https://mete.fyi/wp-content/uploads/2024/10/IMG_0330-768x750.jpg",alt:"Alles Anders TV\u2028",width:828,height:809},{src:"https://mete.fyi/wp-content/uploads/2024/10/IMG_8597-scaled.jpg",thumb:"https://mete.fyi/wp-content/uploads/2024/10/IMG_8597-768x512.jpg",alt:"Alles Anders TV\u2028",width:2048,height:1366},{src:"https://mete.fyi/wp-content/uploads/2024/10/IM /beawarepussycats6-scaled.jpg",thumb:"https://mete.fyi/wp-content/uploads/2024/10/beawarepussycats6-768x576.jpg",alt:"Be Aware Pussycats!",width:1920,height:1440},{src:"https://mete.fyi/wp-content/uploads/2024/10/beawarepussycats4-scaled.jpg",thumb:"https://mete.fyi/wp-content/uploads/2024/10/beawarepussycats4-768x576.jpg",alt:"Be Aware Pussycats!",width:1920,height:1440}],links:[{href:"https://www.postpons.com/",label:"postpons.com"}],externalUrl:null,videos:["https://www.youtube-nocookie.com/embed/F_YaYjCTWtc"],detail:true},{id:6208,slug:"remake",title:"Remake",date:null,excerpt:D,content:D,categories:["visual"],cover:E,images:[E],links:[{href:"https://www.officinemattoli.it/progetti/remake/",label:"officinemattoli.it"}],externalUrl:null,videos:[],detail:false},{id:6207,slug:"queer-pandemia",title:"Queer Pandèmia",date:"2023",excerpt:"\u003Cp class=\"p1\">\u003Ci>Wicked Games &#8211; For a Morphology of Gestures\u003C/i> is a series of visual artworks on the body’s spasmodic response to digitisation, published in \u003Ci>Queerpandemia: Contaminazioni Artistiche di Altro Genere\u003C/i> (Tlon &amp; TWM Factory, 2024).\u003C/p>\n",content:"\u003Cp dir=\"ltr\">\u003Cem>Wicked Games – For a Morphology of Gestures\u003C/em> is a series of scanographies in which movement appears as the body’s spasmodic response to the pervasiveness of digitisation. Hands move erratically in response to the machine’s glitched impressions. Skin merges with stone as an outgrowth of the world. Its textures interweave with objects and their appearances in the rhythm of a shared becoming.\u003C/p>\n\u003Cp dir=\"ltr\">During the pandemic, the invisible agency of the virus heightened a fear closely bound to the body, while media and news kept the possibility of death constantly in view. Behind the gestures, a cosmic void stands for the sense of meaninglessness that many of us felt at the time.\u003C/p>\n\u003Cp dir=\"ltr\">As images lost their meaning through constant consumption in an endless virtual flow, the series turned to the physical qualities of the mineral world, whose slow crystalline transformations remain imperceptible to the human eye. Over millennia, minute changes in terrestrial conditions shape minerals into evocative forms and signs. A key reference for the series is Roger Caillois’s \u003Cem>The Writing of Stones\u003C/em> (\u003Cem>L’Écriture des pierres\u003C/em>, 1970), which reads the patterns found in stones as a kind of writing produced by nature itself.\u003C/p>\n\u003Cp dir=\"ltr\">Featured in \u003Cem>Queerpandemia – Contaminazioni artistiche di altro genere\u003C/em> (Tlon, 2023).\u003C/p>\n",categories:["visual","writing"],cover:{src:"https://mete.fyi/wp-content/uploads/2024/09/queer-pandemia-cover-600x600-1.png",thumb:"https://mete.fyi/wp-content/uploads/2024/09/queer-pandemia-cover-600x600-1.png",alt:"Queer Pandèmia",width:600,height:600},images:[{src:"https://mete.fyi/wp-content/uploads/2022/09/Senza-Titolo-4-Giacomo-Marinsalta-Scanner-Photography-5733x4167px-Wicked-Games-Per-una-morfologia-dei-Gesti-2021.jpg",thumb:"https://mete.fyi/wp-content/uploads/2022/09/Senza-Titolo-4-Giacomo-Marinsalta-Scanner-Photography-5733x4167px-Wicked-Games-Per-una-morfologia-dei-Gesti-2021-768x558.jpg",alt:"Queer Pandèmia",width:1500,height:1090},{src:"https://mete.fyi/wp-content/uploads/2022/09/Senza-Titolo-5-Giacomo-Marinsalta-Scanner-Photography-5733x4167px-Wicked-Games-Per-una-morfologia-dei-Gesti-2021.jpg",thumb:"https://mete.fyi/wp-content/uploads/2022/09/Senza-Titolo-5-Giacomo-Marinsalta-Scanner-Photography-5733x4167px-Wicked-Games-Per-una-morfologia-dei-Gesti-2021-768x558.jpg",alt:"Queer Pandèmia",width:1500,height:1090},{src:"https://mete.fyi/wp-content/uploads/2022/09/Senza-Titolo-7-Giacomo-Marinsalta-Scanner-Photography-5733x4167px-Wicked-Games-Per-una-morfologia-dei-Gesti-2021.jpg",thumb:"https://mete.fyi/wp-content/uploads/2022/09/Senza-Titolo-7-Giacomo-Marinsalta-Scanner-Photography-5733x4167px-Wicked-Games-Per-una-morfologia-d èmia",width:1500,height:1090},{src:"https://mete.fyi/wp-content/uploads/2022/09/Senza-Titolo-18-Giacomo-Marinsalta-Scanner-Photography-14583x10416px-Wicked-Games-Per-una-morfologia-dei-Gesti-2021.jpg",thumb:"https://mete.fyi/wp-content/uploads/2022/09/Senza-Titolo-18-Giacomo-Marinsalta-Scanner-Photography-14583x10416px-Wicked-Games-Per-una-morfologia-dei-Gesti-2021-768x548.jpg",alt:"Queer Pandèmia",width:1500,height:1071}],links:[{href:"https://shop.tlon.it/prodotto/queer-pandemia-contaminazioni-artistiche-di-altro-genere/",label:"shop.tlon.it"}],externalUrl:null,videos:[],detail:true},{id:6206,slug:"climate-fortunes",title:"Climate-Fortunes",date:"2023",excerpt:"\u003Cp class=\"p1\">Curation and illustrations for a climate change horoscope app project reading our future in climate science rather than the stars. The research resulted in an illustrated horoscope, published in the \u003Ci>Zeitschrift für Medienwissenschaft\u003C/i> (transcript Verlag, 2024).\u003C/p>\n",content:"\u003Cp class=\"p1\">Drawing on astrology and grounded in climate science, \u003Ci>Climate Fortunes\u003C/i> is a web app offering a glimpse into a future that is more certain than we might wish.\u003C/p>\n\u003Cp dir=\"ltr\">The project was developed during the \u003Ca href=\"https://www.uni-potsdam.de/de/digital-humanities/aktivitaeten/henriette-herz-hackathons/environmental-data-media-and-the-humanities-hackathon\">\u003Cem>Environmental Data, Media and the Humanities Hackathon\u003C/em>\u003C/a>, held in Potsdam from 31 May to 2 June 2023 and organised by the Network of Digital Humanities at the University of Potsdam. It was created by Lukas Diestel, Maximilian Hepach, Giacomo Marinsalta, Sybille Neumeyer, Jonas Parnow, Birgit Schneider and May Ee Wong, with funding from the Alexander von Humboldt Foundation. The source code is available on \u003Ca href=\"https://github.com/jnsprnw/climate-horoscope\">GitHub\u003C/a>.\u003C/p>\n\u003Cp dir=\"ltr\">The research has also led to the article “ QUARANTINIS_insta-768x768.jpg",alt:"NTS Show w/ GiGi FM",width:2000,height:2000},{src:"https://mete.fyi/wp-content/uploads/2022/09/artworks-si45mkwnzPAstiLo-SAYR2Q-t500x500.jpg",thumb:"https://mete.fyi/wp-content/uploads/2022/09/artworks-si45mkwnzPAstiLo-SAYR2Q-t500x500.jpg",alt:"NTS Show w/ GiGi FM",width:500,height:500}],links:[{href:"https://www.nts.live/shows/gigi-fm",label:"nts.live"}],externalUrl:null,videos:[],detail:true},{id:6200,slug:"bestiario-prossimo",title:"Bestiario Prossimo",date:"2025",excerpt:"\u003Cp class=\"p1\">Curation and graphic design for Cesare D’Antonio’s solo exhibition on the bond between humans and animals.\u003C/p>\n",content:"\u003Cp class=\"p1\">Curation, communication and graphic design for \u003Ci>Bestiario Prossimo\u003C/i>, a solo exhibition by Cesare D’Antonio, a set designer and multidisciplinary artist based in San Benedetto del Tronto (Marche, Italy). Accompanied by a publication, the exhibition explored the bond between humanity and the animal kingdom through paintings, prints, ceramics and installations.\u003C/p>\n\u003Cp class=\"p1\">Each work invited visitors to reflect on the intrinsic value of animals, not only as companions but as beings with their own dignity and wisdom.\u003C/p>\n\u003Cp class=\"p1\">Exhibition: Palazzina Azzurra, San Benedetto del Tronto, 7 December 2024 – 19 January 2025\u003Cbr />\n\u003Cspan>Photos by Mauro Fagotti\u003Cbr />\nVFX by Davide D’Antonio\u003C/span>\u003C/p>\n",categories:["curation","visual"],cover:{src:"https://mete.fyi/wp-content/uploads/2025/01/Bestiario_Prossimo_A3_DEF_WEB.jpg",thumb:"https://mete.fyi/wp-content/uploads/2025/01/Bestiario_Prossimo_A3_DEF_WEB-768x1086.jpg",alt:"Bestiario Prossimo",width:1131,height:1600},images:[{src:"https://mete.fyi/wp-content/uploads/2025/01/Cover-Bestiario-Prossimo.jpg",thumb:"https://mete.fyi/wp-content/uploads/2025/01/Cover-Bestiario-Prossimo-768x502.jpg",alt:"Bestiario Prossimo",width:1600,height:1046},{src:"https://mete.fyi/wp-content/uploads/2025/01/Bestiario_Prossimo_A3_DEF_WEB.jpg",thumb:"https://mete.fyi/wp-content/uploads/2025/01/Bestiario_Prossimo_A3_DEF_WEB-768x1086.jpg",alt:"Bestiario Prossimo",width:1131,height:1600},{src:"https://mete.fyi/wp-content/uploads/2025/01/IMG_20241207_184437.jpg",thumb:"https://mete.fyi/wp-content/uploads/2025/01/IMG_20241207_184437-768x576.jpg",alt:"Bestiario Prossimo",width:1600,height:1200},{src:"https://mete.fyi/wp-content/uploads/2025/01/IMG_4250.jpg",thumb:"https://mete.fyi/wp-content/uploads/2025/01/IMG_4250-768x512.jpg",alt:"Bestiario Prossimo",width:1600,height:1067},{src:"https://mete.fyi/wp-content/uploads/2025/01/IMG_4799.jpg",thumb:"https://mete.fyi/wp-content/uploads/2025/01/IMG_4799-768x533.jpg",alt:"Bestiario Prossimo",width:1600,height:1111},{src:"https://mete.fyi/wp-content/uploads/2025/01/Screenshot-2025-01-22-alle-22.46.39-e1737582841318.jpg",thumb:"https://mete.fyi/wp-content/uploads/2025/01/Screenshot-2025-01-22-alle-22.46.39-e1737582841318-573x1024.jpg",alt:"Bestiario Prossimo",width:744,height:1330},{src:"https://mete.fyi/wp-content/uploads/2025/01/Pinguini_MoloSudCut_1.mp4",thumb:"https://mete.fyi/wp-content/uploads/2025/01/Pinguini_MoloSudCut_1.mp4",alt:"Bestiario Prossimo",width:1080,height:1920},{src:"https://mete.fyi/wp-content/uploads/2025/01/Pinguini_inStudio_3.mp4",thumb:"https://mete.fyi/wp-content/uploads/2025/01/Pinguini_inStudio_3.mp4",alt:"Bestiario Prossimo",width:1080,height:1920},{src:"https://mete.fyi/wp-content/uploads/2025/01/Palazzina.mp4",thumb:"https://mete.fyi/wp-content/uploads/2025/01/Palazzina.mp4",alt:"Bestiario Prossimo",width:1080,height:1920}],links:[{href:"https://misoulart.it/",label:"misoulart.it"}],externalUrl:null,videos:[],detail:true},{id:6199,slug:"weather-reports",title:"Weather Reports \u2028",date:"2023-2024",excerpt:"\u003Cp class=\"p1\">Research assistance, map design and the curation of a collection of artworks on wind for \u003Ci>Weather Reports\u003C/i>, a media studies research programme run by the University of Potsdam and the Winchester Art School.\u003C/p>\n",content:"\u003Cp class=\"p1\">Map design tracing the path of Typhoon Haiyan across the Philippines in 2013, for the article “\u003Ca href=\"https://mediaenviron.org/article/129535-as-invisible-as-wind-as-formless-as-water\">Invisible as Wind, Formless as Water\u003C/a>” by Inez de Ponce, published in volume 6 of \u003Ca href=\"https://mediaenviron.org/section/4661-wind-as-model-media-and-experience\">\u003Ci>Media+Environment\u003C/i>\u003C/a>, “Wind Humanities: An Elemental Media Approach” (edited by Maximilian Hepach, Ryan Bishop, J. R. Carpenter, Jussi Parikka and Birgit Schneider).\u003C/p>\n\u003Cp class=\"p1\">Project assistance and editorial review for \u003Ci>Weather Reports: Wind as Model, Media and Experience\u003C/i>, a media studies research programme run by the University of Potsdam and the Winchester School of Art, including the curation of a \u003Ca href=\"https://winds.report/art.html\">collection\u003C/a> of artworks on wind.\u003C/p>\n",categories:["curation","visual"],cover:{src:"https://mete.fyi/wp-content/uploads/2025/01/Ponce_Winds_Haiyan_Graphic1.jpg",thumb:"https://mete.fyi/wp-content/uploads/2025/01/Ponce_Winds_Haiyan_Graphic1-768x512.jpg",alt:"Weather Reports \u2028",width:1600,height:1067},images:[{src:"https://mete.fyi/wp-content/uploads/2025/01/Ponce_Winds_Haiyan_Graphic1.jpg",thumb:"https://mete.fyi/wp-content/uploads/2025/01/Ponce_Winds_Haiyan_Graphic1-768x512.jpg",alt:"Weather Reports \u2028",width:1600,height:1067},{src:"https://mete.fyi/wp-content/uploads/2025/01/Ponce_Winds_Cities_Graphic2.jpg",thumb:"https://mete.fyi/wp-content/uploads/2025/01/Ponce_Winds_Cities_Graphic2-768x1152.jpg",alt:"Weather Reports \u2028",width:1067,height:1600}],links:[{href:"https://winds.report",label:"winds.report"},{href:"https://mediaenviron.org/article/129535-as-invisible-as-wind-as-formless-as-water",label:"Invisible as Wind, Formless as Water"},{href:"https://mediaenviron.org/section/4661-wind-as-model-media-and-experience",label:"Media+Environment"},{href:"https://winds.report/art.html",label:"collection"}],externalUrl:null,videos:[],detail:true},{id:6198,slug:"reimagine-your-city",title:"Re:imagine Your City",date:null,excerpt:K,content:K,categories:["writing"],cover:L,images:[L],links:[{href:"https://reimaginecity.org/projects/reimagine-your-city-rethinking-urban-paradigms/",label:"reimaginecity.org"}],externalUrl:null,videos:[],detail:false},{id:6197,slug:"laundry-dreams",title:"Laundry Dreams",date:"2024",excerpt:"\u003Cp class=\"p1\">A video poem and installation following sheets and clothes hung out to dry in a Mediterranean city, where laundry blurs the line between public and private and becomes a sign of care and resistance.\u003C/p>\n",content:"\u003Cp class=\"p1\">Video poem and installation by Giacomo Marinsalta\u003Cbr />\nMusic by Lola Lextrait\u003C/p>\n\u003Cp>Can an everyday gesture and an ordinary object such as laundry, usually excluded from the aesthetic gaze, reveal a beauty of their own?\u003Cbr />\n\u003Cspan>The words of a poem accompany a life suspended between dream and reality, on a journey through sheets and clothes hanging in the wind along the streets of a Mediterranean city. \u003C/span>\u003Cspan>Laundry blurs the boundaries between inside and outside, public and private. Across narrow alleys, balconies and windows, fabric becomes language, architectural ornament and a symbol of care and resistance, in contrast with urban policies increasingly governed by an aesthetics of decorum.\u003C/span>\u003C/p>\n\u003Cp class=\"p1\">The project grew out of the research for a Master of Arts thesis in European Media Studies at the University of Potsdam, “Laundering Dreams in the Porous City: The Political Aesthetics of Laundry in Public Space”.\u003C/p>\n",categories:["curation","video"],cover:{src:"https://mete.fyi/wp-content/uploads/2026/02/Screenshot-2026-02-17-alle-21.31.29.jpg",thumb:"https://mete.fyi/wp-content/u
